<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./src/style.css">
  <title>NASA APOD App</title>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>🚀 NASA Astronomy Picture of the Day 🚀</h1>
  </header>

  <main>

    <!-- 🔍 BUSCADOR -->
    <section class="buscador">

      <h2 class="titulo-buscador">NASA APOD</h2>

      <div class="form-buscador">

        <input type="date" id="fecha" class="input-fecha">

        <button id="buscarBtn" class="btn-buscar">
          Buscar
        </button>

      </div>

      <p id="mensajeError" class="error"></p>

    </section>

    <!-- 📸 CONTENIDO -->
    <section class="contenedor-apod">

      <h2 id="titulo">Cargando...</h2>

      <p id="fechaResultado"></p>

      <div id="contenido-media"></div>

      <p id="descripcion"></p>

    </section>

  </main>

  <script type="module" src="./src/script.js"></script>

</body>

</html>
